name: Pages

on:
  push:
    branches: [main]
    # The site is self-contained. Rebuilding it for a change to the detector would publish
    # nothing new, and the generated data it does depend on is committed.
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run should replace the one waiting, but never interrupt a deploy in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: site
        run: bun run check

      # Charts are generated from fixtures/ and committed. Re-running the extractor
      # proves (1) the JSON still matches the corpus and (2) JS peaks still match the
      # golden envelope maxima captured from `yamete analyze`. A live binary check is
      # not available here — the workspace only builds on macOS; run `bun run extract`
      # after `cargo build --release` locally to re-verify against analyze.
      - name: Trace data is current
        working-directory: site
        run: |
          set -euo pipefail
          bun run extract
          if ! git diff --quiet -- src/data/traces.json; then
            echo "::error::site/src/data/traces.json is stale — run 'bun run extract' in site/ and commit the result"
            git diff -- src/data/traces.json
            exit 1
          fi

      - name: Build
        working-directory: site
        run: bun run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
