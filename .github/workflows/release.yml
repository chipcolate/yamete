name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # A tag that disagrees with the manifests would publish a release nobody can
      # correlate with a build. Both files carry the version and both are read by the
      # bundler, so they have to agree with each other as well as with the tag.
      - name: Tag must match the manifests
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          tauri_version="$(jq -r .version app/src-tauri/tauri.conf.json)"
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$tauri_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies '$tag' but Cargo.toml says '$cargo_version' and tauri.conf.json says '$tauri_version'"
            exit 1
          fi

      - name: Install frontend deps
        working-directory: app
        run: bun install --frozen-lockfile

      # The corpus replay runs here too. A release is the worst place to discover the
      # detector regressed, and it costs seconds.
      - name: Test
        run: cargo test --workspace

      # Signing and notarisation are driven entirely by whether these secrets exist.
      # build-app.sh picks the identity out of the keychain and skips notarisation when
      # there are no credentials, so an unsigned release still builds — it simply will not
      # open on anyone else's Mac.
      #
      # Required for a distributable build:
      #   APPLE_CERTIFICATE            base64 of the Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD   its export password
      #   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: NAME (TEAMID)"
      #   APPLE_API_ISSUER             App Store Connect issuer UUID
      #   APPLE_API_KEY                key ID
      #   APPLE_API_KEY_CONTENT        the .p8 file's contents
      - name: Build, sign and notarise
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail

          # Runner has no login keychain identities. Import the .p12, then drop the
          # APPLE_CERTIFICATE env vars so Tauri does not re-import them and pick the wrong
          # cert when the bag contains more than one identity.
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            CERT_PATH="$RUNNER_TEMP/certificate.p12"
            KEYCHAIN_PATH="$RUNNER_TEMP/yamete-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
              -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" \
              "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            rm -f "$CERT_PATH"
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
          fi

          # notarytool wants a file, and a secret is a string. Written outside the working
          # tree so it cannot be picked up by anything that globs the repo.
          if [ -n "${APPLE_API_KEY_CONTENT:-}" ]; then
            mkdir -p "$HOME/.appstoreconnect/private_keys"
            key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
            chmod 600 "$key_path"
            export APPLE_API_KEY_PATH="$key_path"
          fi
          ./build-app.sh

      - name: Checksums
        run: |
          set -euo pipefail
          cd app/src-tauri/target/release/bundle/dmg
          shasum -a 256 *.dmg > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: yamete-macos-arm64
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/dmg/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Tags with a hyphen (v1.2.0-rc1, v1.2.0-beta) publish as prereleases.
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" \
            app/src-tauri/target/release/bundle/dmg/*.dmg \
            app/src-tauri/target/release/bundle/dmg/SHA256SUMS \
            --generate-notes $prerelease
