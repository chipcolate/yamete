[workspace]
resolver = "2"
members = ["crates/yamete-sensor", "crates/yamete-dsp", "crates/yamete-proto", "crates/yamete"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"
repository = "https://github.com/chipcolate/yamete"

[workspace.dependencies]
yamete-sensor = { path = "crates/yamete-sensor" }
yamete-dsp = { path = "crates/yamete-dsp" }
yamete-proto = { path = "crates/yamete-proto" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
