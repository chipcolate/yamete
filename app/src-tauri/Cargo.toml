[package]
name = "spank-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
description = "Menu bar controller for the spank slap detector"

# Deliberately detached from the core workspace: building this pulls in the whole Tauri
# toolchain and needs a built frontend, neither of which should slow down `cargo test`
# on the daemon.
[workspace]

[lib]
name = "spank_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
spank-proto = { path = "../../crates/spank-proto" }
spank-dsp = { path = "../../crates/spank-dsp" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
