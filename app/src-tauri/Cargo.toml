[package]
name = "yamete-app"
version = "0.1.1"
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"
description = "Menu bar controller for the yamete spank detector"

# Deliberately detached from the core workspace: building this pulls in the whole Tauri
# toolchain and needs a built frontend, neither of which should slow down `cargo test`
# on the daemon.
[workspace]

[lib]
name = "yamete_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
yamete-proto = { path = "../../crates/yamete-proto" }
yamete-dsp = { path = "../../crates/yamete-dsp" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
